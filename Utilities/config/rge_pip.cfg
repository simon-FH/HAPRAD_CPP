# MakePhiTable configuration -- RG-E, pi+, one beam energy.
# Run 020026 has E_beam = 10.5473 GeV; other RG-E runs are 10.3894 and 10.4057.
# A table is built for ONE beam energy: K, which defines A, depends on it.

beam_energy           = 10.5473
beam_energy_tolerance = 0.005

pid      = 211

# DIS and semi-inclusive cuts
Q2_min   = 1.0
W2_min   = 4.0
y_max    = 0.85
z_min    = 0.15
z_max    = 1.0
pt2_max  = 1.5

# Missing mass. Below the single-pion threshold the events are exclusive
# e p -> e' pi+ n and HAPRAD refuses them; this also removes the backward-going
# pions (PLAN.md 0.1). The value is an analysis decision.
Mx_min   = 1.5

# Vertex window -- the global RG-E window. Per-target windows (LD2 cell vs
# solid foil) are still to be defined.
vz_min   = -40.0
vz_max   = 26.1197

# Binning: <nbins> <low> <high>. Axes and their order are fixed:
# Q2 [GeV^2], nu [GeV], z, pt2 [GeV^2], phi [deg].
# The resolution follows PLAN.md 2.3; the statistics needed to fill it come from
# the full dataset, not from one run.
bins_Q2  = 18 0.5 10
bins_nu  = 16 1 10.5
bins_z   = 20 0 1
bins_pt2 = 24 0 1.5
bins_phi = 12 -180 180

# A cell is fitted only with at least this many non-empty phi bins and events.
fit_min_phi_bins = 4
fit_min_events   = 50

# Optional per-event weight branch (e.g. 1/acceptance). Unset: every event
# counts 1.
# weight_branch = w

# Optional luminosity, in events per nb of cross section (HAPRAD's sigma is in
# nb/GeV^2 per unit x, y, z, phi[rad]). Unset (1): the table is in arbitrary
# units. sigma_Born and the inelastic tail scale with it, the exclusive tail does
# not, so a real correction needs it -- together with the acceptance correction.
# luminosity = 1
