# Analysis configuration for MakePhiTable, MakeRCGrid and ApplyRC -- RG-E, pi+,
# one beam energy. Read by LoadConfig() in include/RGESelection.hxx.
# Run 020026 has E_beam = 10.5473 GeV; other RG-E runs are 10.3894 and 10.4057.
# A table is built for ONE beam energy: K, which defines A, depends on it.

beam_energy           = 10.5473
beam_energy_tolerance = 0.005

pid      = 211

# DIS and semi-inclusive cuts
Q2_min   = 1.0
W2_min   = 4.0
y_max    = 0.85
z_min    = 0.15
z_max    = 1.0
pt2_max  = 1.5

# Missing mass. Below the single-pion threshold the events are exclusive
# e p -> e' pi+ n and HAPRAD refuses them; this also removes the backward-going
# pions. The value is an analysis choice.
Mx_min   = 1.5

# Vertex window -- the global RG-E window, the same for every target (no
# separate LD2-cell and solid-foil windows).
vz_min   = -40.0
vz_max   = 26.1197

# Binning: <nbins> <low> <high>. Axes and their order are fixed:
# Q2 [GeV^2], nu [GeV], z, pt2 [GeV^2], phi [deg].
# Fine enough that interpolating between cell centres follows the kinematic
# dependence of A; filling it needs the statistics of the full dataset, not of
# one run.
bins_Q2  = 18 0.5 10
bins_nu  = 16 1 10.5
bins_z   = 20 0 1
bins_pt2 = 24 0 1.5
bins_phi = 12 -180 180

# A cell is fitted only with at least this many non-empty phi bins and events
# (effective events, (sum w)^2 / sum w^2, when the events are weighted).
fit_min_phi_bins = 4
fit_min_events   = 50

# Optional per-event weight branch (e.g. 1/acceptance). Unset: every event
# counts 1.
# weight_branch = w

# Optional luminosity, in events per nb of cross section (HAPRAD's sigma is in
# nb/GeV^2 per unit x, y, z, phi[rad]). Unset (1): the table is in arbitrary
# units. sigma_Born and the inelastic tail scale with it, the exclusive tail does
# not, so a real correction needs it -- together with the acceptance correction.
# luminosity = 1

# ---- RC grid and weights (MakeRCGrid, ApplyRC) ----
# HAPRAD is evaluated at the NODES of a regular grid, '<nodes> <first> <last>',
# and interpolated to each event. Axes: Q2 [GeV^2], nu [GeV], z, p_t [GeV] (not
# pt2: the RC factor's phi modulation grows like p_t), phi [deg] on 0..180
# (the unpolarised cross section is symmetric under phi -> 360 - phi). Events
# outside the node range get no weight (rc_status = 2). The resolution is set
# by the interpolation error budget, MakeRCGrid check / check_rc_grid.py.
rc_nodes_Q2  = 9 1 9
rc_nodes_nu  = 8 2 9
rc_nodes_z   = 9 0.15 0.95
rc_nodes_pt  = 11 0 1.25
rc_nodes_phi = 13 0 180

# Z/A of the target: the share of the exclusive tail (MAID is a free-proton
# model). LD2 0.5, C 0.5, Al 13/27, Cu 29/63.546, Sn 50/118.71, Pb 82/207.2.
target_naz = 0.5

# Include the exclusive radiative tail in the weight. Only meaningful for a
# table in absolute units (see `luminosity`); ApplyRC refuses `yes` otherwise.
rc_exclusive_tail = no
