# farm.cfg -- settings for the RC workflow on the JLab farm. Sourced (bash) by
# submit_rc_workflow.sh and, through the copy it makes in the workflow's output
# directory, by every job (rc_job.sh). Edit before the first submission.

# This repository, built on ifarm (make in . and in Utilities/) with the same
# ROOT that ENV_SETUP loads.
HAPRAD_CPP=${HOME}/HAPRAD_CPP

# Commands that put ROOT (root-config, hadd) on PATH inside a farm job (bash).
# modules.sh defines `module` in a non-interactive shell. The ROOT must have
# MathMore (`root-config --has-mathmore`): of the CVMFS builds, 6.24-6.28 do,
# 6.30.x do not.
ENV_SETUP="source /etc/profile.d/modules.sh; module use /cvmfs/oasis.opensciencegrid.org/jlab/scicomp/sw/el9/modulefiles; module load root/6.28.10-gcc11.4.0"

# Input ntuples of one run. Placeholders: %RUN% the six-digit run number
# (020026), %RUNNO% the number without leading zeros (20026), %TARGET% the
# target given to submit_rc_workflow.sh (C_D2, Pb_D2, Cu_D2, Sn_D2, Al_D2,
# empty_D2), %FIELD% and %TRACKING% the two settings below. The pass-1
# ntuples: one file per run.
FIELD=inb          # inb (inbending) or out (outbending); --field overrides
TRACKING=dc_fmt    # dc (DC tracking) or dc_fmt (DC + FMT); --tracking overrides
DATA_PATTERN=/volatile/clas12/antorad/rge/data/pass1/%FIELD%/%TARGET%/%TRACKING%/ntuple_files/ntuples_%TRACKING%_%RUN%.root

# Where workflows write: one subdirectory per workflow. /volatile is large but
# not backed up, and old files are deleted when the area fills up: copy the
# final weights elsewhere if they are to be kept.
OUT_BASE=/volatile/clas12/${USER}/haprad_rc

# Analysis config (cuts, binning, RC grid nodes, target_naz). One per target.
CONFIG=${HAPRAD_CPP}/Utilities/config/rge_pip.cfg

# Directory holding pi_n_maid.dat (the MAID grid HAPRAD reads).
HAPRAD_DATA_DIR=${HAPRAD_CPP}/haprad2

# Workflow shape. ITERATIONS RC iterations, each: fill per run -> fit -> grid
# in NCHUNKS chunks -> merge -> weights per run. The iteration closure test
# meets the 0.002 tolerance at the third grid, so 3 for production; 2 (-i 2)
# is enough for a benchmark, as every iteration costs the same.
ITERATIONS=3
NCHUNKS=50

# Slurm partition, and account if yours needs one (empty: swif2's default).
PARTITION=ifarm
ACCOUNT=""

# Resources per job type: "<time> <ram> <disk>", from the 3-run C_D2 benchmark
# (timing_report.py): longest fill 3 min at 518 MB, apply 4 min, grid chunk
# 40 min at 309 MB (with 50 chunks). Each limit is at least 4x the measured
# time and 2x the memory; the grid's also covers the larger tables of the full
# dataset, which have more valid nodes, and the fit's the merge of many runs'
# counts. <disk> is
# the compute node's local scratch disk: the jobs read their inputs in place
# and write their outputs straight to OUT_BASE, so 1g is plenty.
RES_FILL="30min 2g 1g"
RES_FIT="30min 2g 1g"
RES_GRID="3h 1g 1g"
RES_MERGE="30min 1g 1g"
RES_APPLY="30min 1g 1g"
