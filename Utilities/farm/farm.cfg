# farm.cfg -- settings for the RC workflow on the JLab farm. Sourced (bash) by
# submit_rc_workflow.sh and, through the copy it makes in the workflow's output
# directory, by every job (rc_job.sh). Edit before the first submission.

# This repository on /work, built on ifarm (make in . and in Utilities/).
HAPRAD_CPP=/work/clas12/rg-e/${USER}/HAPRAD_CPP

# Commands that put ROOT (root-config, hadd) on PATH inside a farm job, i.e.
# whatever you run interactively before building. Leave empty if your login
# environment already does it.
ENV_SETUP=""

# Input ntuples of one run: %RUN% becomes the six-digit run number (020026),
# %RUNNO% the number without leading zeros (20026). The pass-1 ntuples, in the
# same format as the local ones (<n>_ntuples_dc.root, one directory per run).
DATA_PATTERN=/volatile/clas12/antorad/rge/data/pass1/%RUN%/*_ntuples_dc.root

# Where workflows write: one subdirectory per workflow.
OUT_BASE=/volatile/clas12/rg-e/${USER}/haprad_rc

# Analysis config (cuts, binning, RC grid nodes, target_naz). One per target.
CONFIG=${HAPRAD_CPP}/Utilities/config/rge_pip.cfg

# Directory holding pi_n_maid.dat (the MAID grid HAPRAD reads).
HAPRAD_DATA_DIR=${HAPRAD_CPP}/haprad2

# Workflow shape. ITERATIONS RC iterations, each: fill per run -> fit -> grid
# in NCHUNKS chunks -> merge -> weights per run. The iteration closure test
# meets the 0.002 tolerance at the third grid, so 3 for production; 2 (-i 2)
# is enough for a benchmark, as every iteration costs the same.
ITERATIONS=3
NCHUNKS=50

# Slurm partition, and account if yours needs one (empty: swif2's default).
PARTITION=ifarm
ACCOUNT=""

# Resources per job type: "<time> <ram> <disk>". Generous first guesses; the
# benchmark (timing_report.py) prints values measured from a test workflow.
RES_FILL="2h 2g 4g"
RES_FIT="2h 2g 2g"
RES_GRID="4h 2g 1g"
RES_MERGE="1h 2g 2g"
RES_APPLY="2h 2g 4g"
